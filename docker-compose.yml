services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: genopredict-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
      - ./mlflow.db:/mlflow/mlflow.db
    networks:
      - mlops_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genopredict-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GENOPREDICT_MONITORING_LOG=/app/data/monitoring/predictions.jsonl
    depends_on:
      - mlflow
    volumes:
      - ./data/monitoring:/app/data/monitoring
      - ./reports/monitoring:/app/reports/monitoring
    networks:
      - mlops_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genopredict-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - mlops_network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: genopredict-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    networks:
      - mlops_network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: genopredict-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - mlops_network

volumes:
  prometheus_data:
  grafana_data:

networks:
  mlops_network:
    driver: bridge
