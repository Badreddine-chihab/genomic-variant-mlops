services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: genopredict-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
      - ./mlflow.db:/mlflow/mlflow.db
    networks:
      - mlops_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genopredict-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - S3_BUCKET=${S3_BUCKET}
    depends_on:
      - mlflow
    networks:
      - mlops_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genopredict-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - mlops_network

networks:
  mlops_network:
    driver: bridge
