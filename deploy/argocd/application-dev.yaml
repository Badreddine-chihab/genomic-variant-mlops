apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: genopredict-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Badreddine-chihab/genomic-variant-mlops.git
    targetRevision: main
    path: deploy/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: genopredict-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
