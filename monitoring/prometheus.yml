global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: genopredict-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: genopredict-drift-monitor
    metrics_path: /metrics
    static_configs:
      - targets:
          - drift-monitor:8001
