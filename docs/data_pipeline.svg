<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">Data Pipeline</title>
  <desc id="desc">Versioned genomic data becomes schema-safe parquet for training and serving.</desc>
  <defs>
    <style>
      .page { fill: #f5f7fb; }
      .canvas { fill: #ffffff; stroke: #d5dce8; stroke-width: 1.3; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: #64748b; }
      .zone-title { font: 700 13px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: .5px; }
      .label { font: 700 10px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: .7px; }
      .box-title { font: 700 16px Arial, Helvetica, sans-serif; fill: #172033; }
      .body { font: 400 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .caption { font: 600 12px Arial, Helvetica, sans-serif; fill: #64748b; }
      .mono { font: 600 12px Consolas, Menlo, monospace; fill: #475569; }
      .icon { fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: currentColor; stroke: none; }
      .arrow { stroke: #64748b; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow-soft); }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5.5 L1 10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-soft" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5.5 L1 10 Z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect class="page" width="100%" height="100%"/>
  <rect class="canvas" x="28" y="26" width="1444" height="568" rx="10"/>
  <text class="title" x="66" y="78">Data Pipeline</text>
  <text class="subtitle" x="66" y="108">Versioned genomic data becomes schema-safe parquet for training and serving.</text>
  <rect x="56" y="152" width="430" height="300" rx="10" fill="#ecfeff" stroke="#0f766e" stroke-opacity=".22" stroke-width="1.2"/>
  <text class="zone-title" x="74" y="180">DATA LAYER</text>
  <rect x="516" y="152" width="560" height="300" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".22" stroke-width="1.2"/>
  <text class="zone-title" x="534" y="180">PROCESSING</text>
  <rect x="1106" y="152" width="338" height="300" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-opacity=".22" stroke-width="1.2"/>
  <text class="zone-title" x="1124" y="180">SERVING DATA</text>
  <g filter="url(#shadow)">
    <rect x="74" y="230" width="243" height="170" rx="12" fill="#ffffff" stroke="#d5dce8" stroke-width="1.3"/>
    <rect x="74" y="230" width="243" height="6" rx="3" fill="#b45309"/>
    <rect x="92" y="254" width="42" height="42" rx="10" fill="#fffbeb" stroke="#b45309" stroke-opacity=".28"/>
    <g transform="translate(101 263)" style="color:#b45309"><path class="icon" d="M7 3c8 3 8 15 0 18"/><path class="icon" d="M17 3c-8 3-8 15 0 18"/><path class="icon" d="M8 7h8M8 12h8M8 17h8"/></g>
    <rect x="146" y="256" width="58" height="22" rx="11" fill="#b45309"/>
    <text class="label" x="160" y="271">SOURCE</text>
    <text class="box-title" x="146" y="296">dbNSFP extracts</text>
    <text class="body" x="96" y="324">Raw chromosome files</text>
    <text class="body" x="96" y="343">DVC pointers in repo</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="351" y="230" width="243" height="170" rx="12" fill="#ffffff" stroke="#d5dce8" stroke-width="1.3"/>
    <rect x="351" y="230" width="243" height="6" rx="3" fill="#0f766e"/>
    <rect x="369" y="254" width="42" height="42" rx="10" fill="#ecfeff" stroke="#0f766e" stroke-opacity=".28"/>
    <g transform="translate(378 263)" style="color:#0f766e"><path class="icon" d="M7 17h10a5 5 0 0 0 .4-10 7 7 0 0 0-13 2.5A4 4 0 0 0 7 17z"/></g>
    <rect x="423" y="256" width="60" height="22" rx="11" fill="#0f766e"/>
    <text class="label" x="437" y="271">VERSION</text>
    <text class="box-title" x="423" y="296">DVC + S3</text>
    <text class="body" x="373" y="324">Pull data when missing</text>
    <text class="body" x="373" y="343">Remote artifact store</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="628" y="230" width="243" height="170" rx="12" fill="#ffffff" stroke="#d5dce8" stroke-width="1.3"/>
    <rect x="628" y="230" width="243" height="6" rx="3" fill="#15803d"/>
    <rect x="646" y="254" width="42" height="42" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".28"/>
    <g transform="translate(655 263)" style="color:#15803d"><path class="icon" d="M8 7 3 12l5 5"/><path class="icon" d="m16 7 5 5-5 5"/><path class="icon" d="m14 4-4 16"/></g>
    <rect x="700" y="256" width="58" height="22" rx="11" fill="#15803d"/>
    <text class="label" x="714" y="271">STITCH</text>
    <text class="box-title" x="700" y="296">Stitching_chr.py</text>
    <text class="body" x="650" y="324">Polars/PyArrow processing</text>
    <text class="body" x="650" y="343">Unified variant table</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="905" y="230" width="243" height="170" rx="12" fill="#ffffff" stroke="#d5dce8" stroke-width="1.3"/>
    <rect x="905" y="230" width="243" height="6" rx="3" fill="#2563eb"/>
    <rect x="923" y="254" width="42" height="42" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".28"/>
    <g transform="translate(932 263)" style="color:#2563eb"><path class="icon" d="M6 3h8l4 4v14H6z"/><path class="icon" d="M14 3v5h5"/><path class="icon" d="M9 13h6M9 17h6"/></g>
    <rect x="977" y="256" width="58" height="22" rx="11" fill="#2563eb"/>
    <text class="label" x="991" y="271">ENCODE</text>
    <text class="box-title" x="977" y="296">Feature encoding</text>
    <text class="body" x="927" y="324">Contracted model inputs</text>
    <text class="body" x="927" y="343">Generated schema docs</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1182" y="230" width="243" height="170" rx="12" fill="#ffffff" stroke="#d5dce8" stroke-width="1.3"/>
    <rect x="1182" y="230" width="243" height="6" rx="3" fill="#6d28d9"/>
    <rect x="1200" y="254" width="42" height="42" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-opacity=".28"/>
    <g transform="translate(1209 263)" style="color:#6d28d9"><ellipse class="icon" cx="12" cy="5" rx="8" ry="3"/><path class="icon" d="M4 5v10c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path class="icon" d="M4 10c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
    <rect x="1254" y="256" width="58" height="22" rx="11" fill="#6d28d9"/>
    <text class="label" x="1268" y="271">SERVE</text>
    <text class="box-title" x="1254" y="296">Feature store</text>
    <text class="body" x="1204" y="324">FastAPI local lookup</text>
    <text class="body" x="1204" y="343">S3 fallback bridge</text>
  </g>
  <path class="arrow" d="M317 315 L351 315"/>
  <path class="arrow" d="M594 315 L628 315"/>
  <path class="arrow" d="M871 315 L905 315"/>
  <path class="arrow" d="M1148 315 L1182 315"/>
  <text class="mono" x="74" y="548">Commands: python run_pipeline.py | make feature-schema.</text>
</svg>
