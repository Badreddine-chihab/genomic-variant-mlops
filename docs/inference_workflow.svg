<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">Online Inference</title>
  <desc id="desc">The product UI calls FastAPI, which resolves features and returns calibrated prediction evidence.</desc>
  <defs>
    <style>
      .page { fill: #f5f7fb; }
      .canvas { fill: #ffffff; stroke: #d5dce8; stroke-width: 1.3; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #172033; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: #64748b; }
      .zone-title { font: 700 13px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: .5px; }
      .label { font: 700 10px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: .7px; }
      .box-title { font: 700 16px Arial, Helvetica, sans-serif; fill: #172033; }
      .body { font: 400 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .caption { font: 600 12px Arial, Helvetica, sans-serif; fill: #64748b; }
      .mono { font: 600 12px Consolas, Menlo, monospace; fill: #475569; }
      .icon { fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: currentColor; stroke: none; }
      .arrow { stroke: #64748b; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow-soft); }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5.5 L1 10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-soft" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5.5 L1 10 Z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect class="page" width="100%" height="100%"/>
  <rect class="canvas" x="28" y="26" width="1444" height="568" rx="10"/>
  <text class="title" x="66" y="78">Online Inference</text>
  <text class="subtitle" x="66" y="108">The product UI calls FastAPI, which resolves features and returns calibrated prediction evidence.</text>
  <rect x="56" y="152" width="430" height="300" rx="10" fill="#fffbeb" stroke="#b45309" stroke-opacity=".22" stroke-width="1.2"/>
  <text class="zone-title" x="74" y="180">PUBLIC ENTRY</text>
  <rect x="516" y="152" width="560" height="300" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".22" stroke-width="1.2"/>
  <text class="zone-title" x="534" y="180">APPLICATION RUNTIME</text>
  <rect x="1106" y="152" width="338" height="300" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".22" stroke-width="1.2"/>
  <text class="zone-title" x="1124" y="180">ML RUNTIME</text>
  <g filter="url(#shadow)">
    <rect x="74" y="230" width="243" height="170" rx="12" fill="#ffffff" stroke="#d5dce8" stroke-width="1.3"/>
    <rect x="74" y="230" width="243" height="6" rx="3" fill="#b45309"/>
    <rect x="92" y="254" width="42" height="42" rx="10" fill="#fffbeb" stroke="#b45309" stroke-opacity=".28"/>
    <g transform="translate(101 263)" style="color:#b45309"><rect class="icon" x="4" y="5" width="16" height="11" rx="2"/><path class="icon" d="M9 20h6M12 16v4"/></g>
    <rect x="146" y="256" width="58" height="22" rx="11" fill="#b45309"/>
    <text class="label" x="160" y="271">UI</text>
    <text class="box-title" x="146" y="296">React dashboard</text>
    <text class="body" x="96" y="324">Predict, VCF Lab</text>
    <text class="body" x="96" y="343">Monitoring, Explainability</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="351" y="230" width="243" height="170" rx="12" fill="#ffffff" stroke="#d5dce8" stroke-width="1.3"/>
    <rect x="351" y="230" width="243" height="6" rx="3" fill="#475569"/>
    <rect x="369" y="254" width="42" height="42" rx="10" fill="#f8fafc" stroke="#475569" stroke-opacity=".28"/>
    <g transform="translate(378 263)" style="color:#475569"><rect class="icon" x="4" y="5" width="16" height="6" rx="1"/><rect class="icon" x="4" y="13" width="16" height="6" rx="1"/><path class="icon" d="M7 8h.1M7 16h.1"/></g>
    <rect x="423" y="256" width="58" height="22" rx="11" fill="#475569"/>
    <text class="label" x="437" y="271">PROXY</text>
    <text class="box-title" x="423" y="296">Nginx / Vite</text>
    <text class="body" x="373" y="324">Same-origin /api</text>
    <text class="body" x="373" y="343">Local and Docker parity</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="628" y="230" width="243" height="170" rx="12" fill="#ffffff" stroke="#d5dce8" stroke-width="1.3"/>
    <rect x="628" y="230" width="243" height="6" rx="3" fill="#2563eb"/>
    <rect x="646" y="254" width="42" height="42" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".28"/>
    <g transform="translate(655 263)" style="color:#2563eb"><path class="icon" d="M4 12h5"/><path class="icon" d="M15 12h5"/><circle class="icon" cx="12" cy="12" r="3"/><path class="icon" d="M12 4v5M12 15v5"/></g>
    <rect x="700" y="256" width="58" height="22" rx="11" fill="#2563eb"/>
    <text class="label" x="714" y="271">API</text>
    <text class="box-title" x="700" y="296">FastAPI</text>
    <text class="body" x="650" y="324">Schema enforcement</text>
    <text class="body" x="650" y="343">Model loaded at startup</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="905" y="230" width="243" height="170" rx="12" fill="#ffffff" stroke="#d5dce8" stroke-width="1.3"/>
    <rect x="905" y="230" width="243" height="6" rx="3" fill="#6d28d9"/>
    <rect x="923" y="254" width="42" height="42" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-opacity=".28"/>
    <g transform="translate(932 263)" style="color:#6d28d9"><path class="icon" d="M5 6h14v12H5z"/><path class="icon" d="M8 9h8M8 13h8"/><path class="icon" d="M8 18v3h8v-3"/></g>
    <rect x="977" y="256" width="58" height="22" rx="11" fill="#6d28d9"/>
    <text class="label" x="991" y="271">MODEL</text>
    <text class="box-title" x="977" y="296">MLflow model</text>
    <text class="body" x="927" y="324">Production alias</text>
    <text class="body" x="927" y="343">Registry-backed loading</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1182" y="230" width="243" height="170" rx="12" fill="#ffffff" stroke="#d5dce8" stroke-width="1.3"/>
    <rect x="1182" y="230" width="243" height="6" rx="3" fill="#15803d"/>
    <rect x="1200" y="254" width="42" height="42" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".28"/>
    <g transform="translate(1209 263)" style="color:#15803d"><path class="icon" d="M4 19V5"/><path class="icon" d="M4 19h16"/><rect class="icon" x="7" y="12" width="2.5" height="5"/><rect class="icon" x="12" y="8" width="2.5" height="9"/><rect class="icon" x="17" y="5" width="2.5" height="12"/></g>
    <rect x="1254" y="256" width="58" height="22" rx="11" fill="#15803d"/>
    <text class="label" x="1268" y="271">RESULT</text>
    <text class="box-title" x="1254" y="296">Prediction</text>
    <text class="body" x="1204" y="324">Class, probability</text>
    <text class="body" x="1204" y="343">Confidence score</text>
  </g>
  <path class="arrow" d="M317 315 L351 315"/>
  <path class="arrow" d="M594 315 L628 315"/>
  <path class="arrow" d="M871 315 L905 315"/>
  <path class="arrow" d="M1148 315 L1182 315"/>
  <text class="mono" x="74" y="548">Endpoint family: /api/health, /api/predict, /api/model-info, /metrics.</text>
</svg>
