name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # Mise à jour vers v4 (Node.js 24)

      - name: Set up Python
        uses: actions/setup-python@v5  # Mise à jour vers v5 (Node.js 24)
        with:
          python-version: '3.11'  # Aligné avec ton Dockerfile Python 3.11

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest  # Assure-toi que pytest est installé

      - name: Run Tests
        # Le || true évite l'exit code 5 si tu n'as pas encore de fichiers tests
        run: |
          python -m pytest --junitxml=test-results.xml || echo "Aucun test trouvé pour le moment"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: success() # Ne build que si les tests passent

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/genomic-variant-mlops:latest

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to AWS ECS
        run: |
          aws ecs update-service --cluster genopredict-cluster --service streamlit-service --force-new-deployments